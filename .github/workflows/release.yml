name: Release Builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach artifacts to (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache electron-builder
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron-builder
          key: ${{ matrix.os }}-electron-builder-${{ hashFiles('package-lock.json') }}

      - name: Install Linux packaging tools
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      - name: Install dependencies
        run: npm ci

      - name: Build (${{ matrix.target }})
        run: npm run dist:${{ matrix.target }}
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload Linux artifacts
        if: matrix.target == 'linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          gh release upload "$TAG" \
            dist/*.AppImage \
            dist/*.deb \
            dist/*.pacman \
            --clobber \
            --repo ${{ github.repository }}

      - name: Upload macOS artifacts
        if: matrix.target == 'mac'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          gh release upload "$TAG" \
            dist/*.dmg \
            --clobber \
            --repo ${{ github.repository }}

      - name: Upload Windows artifacts
        if: matrix.target == 'win'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          gh release upload "$TAG" \
            "dist/Bayflix Setup ${TAG#v}.exe" \
            --clobber \
            --repo ${{ github.repository }}
